name: Bright Scan - project-level entrypoints (test)

on:
  push:
    branches: ['testingeverything']
    paths-ignore:
      - '.github/workflows/discoveryurl.yml'   # editing the discovery file won't start a scan
  workflow_dispatch:
    inputs:
      scan_name:
        description: "Scan name shown in the Bright dashboard"
        required: false
        default: "brokencrystals entrypoints scan"
      # --- Blocking options (uncomment together with the "Wait for issues" step) ---
      # severity:
      #   description: "Fail the job on first issue of this severity or higher"
      #   required: true
      #   default: "medium"
      #   type: choice
      #   options:
      #     - any
      #     - medium
      #     - high
      #     - critical
      # timeout_seconds:
      #   description: "How long to wait for issues before exiting"
      #   required: false
      #   default: "10800"
      project_id:
        description: "Bright project ID (blank = repo var BRIGHT_PROJECT_ID)"
        required: false
        default: ""
      repeater_id:
        description: "Repeater ID (blank = repo var BRIGHT_REPEATER_ID)"
        required: false
        default: ""
      entrypoint_statuses:
        description: "Comma-separated entrypoint statuses to include (add 'tested' to cover all entrypoints)"
        required: false
        default: "new,changed,vulnerable"
      buckets:
        description: "Comma-separated test buckets (business_logic, client_side, cve, legacy, api, server_side, mcp_attacks...)"
        required: false
        default: "business_logic,client_side,cve,legacy"

permissions:
  contents: read
  security-events: write

jobs:
  bright:
    name: Entrypoints DAST scan
    runs-on: ubuntu-latest
    steps:
      - name: Resolve settings
        id: cfg
        run: |
          PID="${{ inputs.project_id || vars.BRIGHT_PROJECT_ID }}"
          RID="${{ inputs.repeater_id || vars.BRIGHT_REPEATER_ID }}"
          [ -z "$PID" ] && { echo "::error::No project ID"; exit 1; }
          [ -z "$RID" ] && { echo "::error::No repeater ID - internal targets need a repeater"; exit 1; }
          {
            echo "project=$PID"
            echo "repeaters=[\"$RID\"]"
            echo "name=${{ inputs.scan_name || 'brokencrystals entrypoints scan' }} ${{ github.sha }}"
            # echo "severity=${{ inputs.severity || 'medium' }}"
            # echo "timeout=${{ inputs.timeout_seconds || '10800' }}"
            STATUSES="${{ inputs.entrypoint_statuses || 'new,changed,vulnerable' }}"
            echo "statuses=$(echo "$STATUSES" | tr -d ' ' | jq -Rc 'split(",")')"
            BUCKETS="${{ inputs.buckets || 'business_logic,client_side,cve,legacy' }}"
            echo "buckets=$(echo "$BUCKETS" | tr -d ' ' | jq -Rc 'split(",")')"
          } >> "$GITHUB_OUTPUT"
          echo "Project: $PID | Repeater: $RID"

      # Calls Bright's REST API (POST /api/v1/scans) directly, because the
      # run-scan action has no input for test buckets.
      - name: Start Bright scan (test buckets)
        id: start
        env:
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          BRIGHT_HOST: ${{ vars.BRIGHT_HOSTNAME || 'app.brightsec.com' }}
          NAME: ${{ steps.cfg.outputs.name }}
          PID: ${{ steps.cfg.outputs.project }}
          REPEATERS: ${{ steps.cfg.outputs.repeaters }}
          STATUSES: ${{ steps.cfg.outputs.statuses }}
          BUCKETS: ${{ steps.cfg.outputs.buckets }}
        run: |
          BODY=$(jq -n \
            --arg name "$NAME" --arg pid "$PID" \
            --argjson repeaters "$REPEATERS" \
            --argjson statuses "$STATUSES" \
            --argjson buckets "$BUCKETS" \
            '{name: $name, projectId: $pid, module: "dast",
              buckets: $buckets, repeaters: $repeaters,
              entryPointFilter: {securityStatus: $statuses, connectivityStatus: ["ok"]}}')
          echo "Request body:"; echo "$BODY" | jq .
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "https://$BRIGHT_HOST/api/v1/scans" \
            -H "Authorization: Api-Key $BRIGHT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1); JSON=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE"; echo "$JSON" | jq . 2>/dev/null || echo "$JSON"
          if [ "$CODE" -ge 300 ]; then echo "::error::Bright API returned $CODE"; exit 1; fi
          ID=$(echo "$JSON" | jq -r '.id')
          echo "$JSON" | jq -r '.warnings[]? | "::warning::" + (.message // tostring)'
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "url=https://$BRIGHT_HOST/scans/$ID" >> "$GITHUB_OUTPUT"

      - name: Show scan URL
        run: echo "Scan started - ${{ steps.start.outputs.url }}"

      # Blocking step disabled for testing - uncomment to fail the job on issues
      # - name: Wait for issues
      #   uses: BrightSec/wait-for@v1.1
      #   with:
      #     api_token: ${{ secrets.BRIGHT_TOKEN }}
      #     scan: ${{ steps.start.outputs.id }}
      #     wait_for: ${{ steps.cfg.outputs.severity }}
      #     timeout: ${{ steps.cfg.outputs.timeout }}
      #     stop_scan: true
      #     code_scanning_alerts: true
