name: Bright Discovery - crawler
#test
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to crawl"
        required: true
        default: "https://brokencrystals.com/vendor/counter-up/jquery.counterup.min.js"
      discovery_name:
        description: "Discovery name shown in Bright"
        required: false
        default: "crawler discovery"
      auth_object_id:
        description: "Auth object ID (blank = repo var BRIGHT_AUTH_OBJECT_ID, or anonymous)"
        required: false
        default: ""
      project_id:
        description: "Bright project ID (blank = repo var BRIGHT_PROJECT_ID)"
        required: false
        default: ""
      repeater_id:
        description: "Repeater ID (blank = repo var BRIGHT_REPEATER_ID, or no repeater)"
        required: false
        default: ""
      start_repeater_in_job:
        description: "Start the repeater inside this job (only if this runner can reach the target)"
        type: boolean
        required: false
        default: false
      crawl_parent_subdomains:
        description: "Crawl parent path folders and subdomains"
        required: false
        default: "false"
      wait_timeout_seconds:
        description: "How long to wait for discovery to finish"
        required: false
        default: "3600"

permissions:
  contents: read

jobs:
  discover:
    name: Crawler discovery
    runs-on: ubuntu-latest
    steps:
      - name: Resolve IDs
        id: ids
        run: |
          PID="${{ inputs.project_id || vars.BRIGHT_PROJECT_ID }}"
          if [ -z "$PID" ]; then echo "::error::No project ID"; exit 1; fi
          AID="${{ inputs.auth_object_id || vars.BRIGHT_AUTH_OBJECT_ID }}"
          RID="${{ inputs.repeater_id || vars.BRIGHT_REPEATER_ID }}"
          if [ -n "$RID" ]; then REPEATERS="[\"$RID\"]"; else REPEATERS="[]"; fi
          {
            echo "project=$PID"
            echo "auth=$AID"
            echo "repeater=$RID"
            echo "repeaters=$REPEATERS"
          } >> "$GITHUB_OUTPUT"
          echo "Project: $PID; Auth: ${AID:-<anonymous>}; Repeater: ${RID:-<none>}"

      - name: Start repeater in background
        if: inputs.start_repeater_in_job && steps.ids.outputs.repeater != ''
        env:
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
        run: |
          nohup npx --yes @brightsec/cli repeater \
            --id "${{ steps.ids.outputs.repeater }}" \
            --token "$BRIGHT_TOKEN" \
            --hostname app.brightsec.com > repeater.log 2>&1 &
          sleep 30
          tail -n 20 repeater.log

      - name: Start crawler discovery
        id: start
        uses: BrightSec/run-discovery@v1.1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          name: ${{ inputs.discovery_name }} ${{ github.sha }}
          project_id: ${{ steps.ids.outputs.project }}
          auth_object_id: ${{ steps.ids.outputs.auth }}
          repeaters: ${{ steps.ids.outputs.repeaters }}
          discovery_types: |
            ["crawler"]
          crawler_urls: |
            ["${{ inputs.target_url }}"]
          crawl_parent_subdomains: ${{ inputs.crawl_parent_subdomains }}

      - name: Show discovery URL
        run: echo "Discovery - ${{ steps.start.outputs.url }}"

      - name: Wait for discovery
        uses: BrightSec/wait-for-discovery@v1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          discovery_id: ${{ steps.start.outputs.id }}
          project_id: ${{ steps.ids.outputs.project }}
          timeout: ${{ inputs.wait_timeout_seconds }}
