name: Bright Discovery - crawler (test)

on:
  push:
    branches: ['testingeverything']
    paths-ignore:
      - '.github/workflows/bright-scan.yml'   # editing the scan file won't start a discovery
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to crawl (reached through the repeater)"
        required: true
        default: "https://brokencrystals.com/vendor/counter-up/jquery.counterup.min.js"
      discovery_name:
        description: "Discovery name shown in Bright"
        required: false
        default: "Crawler discovery"
      repeater_id:
        description: "Repeater ID (blank = repo var BRIGHT_REPEATER_ID)"
        required: false
        default: ""
      auth_object_id:
        description: "Auth object ID (blank = repo var BRIGHT_AUTH_OBJECT_ID, or anonymous)"
        required: false
        default: ""
      project_id:
        description: "Bright project ID (blank = repo var BRIGHT_PROJECT_ID)"
        required: false
        default: ""
      crawl_parent_subdomains:
        description: "Crawl parent path folders and subdomains"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  discover:
    name: Crawler discovery
    runs-on: ubuntu-latest
    steps:
      - name: Resolve settings
        id: cfg
        run: |
          PID="${{ inputs.project_id || vars.BRIGHT_PROJECT_ID }}"
          URL="${{ inputs.target_url || vars.BRIGHT_TARGET_URL || 'https://brokencrystals.com/vendor/counter-up/jquery.counterup.min.js' }}"
          RID="${{ inputs.repeater_id || vars.BRIGHT_REPEATER_ID }}"
          AID="${{ inputs.auth_object_id || vars.BRIGHT_AUTH_OBJECT_ID }}"
          [ -z "$PID" ] && { echo "::error::No project ID"; exit 1; }
          [ -z "$URL" ] && { echo "::error::No target URL"; exit 1; }
          [ -z "$RID" ] && { echo "::error::No repeater ID - internal targets need a repeater"; exit 1; }
          {
            echo "project=$PID"
            echo "url=$URL"
            echo "auth=$AID"
            echo "repeaters=[\"$RID\"]"
            echo "name=${{ inputs.discovery_name || 'crawler discovery' }} ${{ github.sha }}"
            echo "parent=${{ inputs.crawl_parent_subdomains || 'false' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Project: $PID | URL: $URL | Repeater: $RID | Auth: ${AID:-<anonymous>}"

      - name: Start crawler discovery
        id: start
        uses: BrightSec/run-discovery@v1.1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          name: ${{ steps.cfg.outputs.name }}
          project_id: ${{ steps.cfg.outputs.project }}
          auth_object_id: ${{ steps.cfg.outputs.auth }}
          repeaters: ${{ steps.cfg.outputs.repeaters }}
          discovery_types: |
            ["crawler"]
          crawler_urls: |
            ["${{ steps.cfg.outputs.url }}"]
          crawl_parent_subdomains: ${{ steps.cfg.outputs.parent }}

      - name: Show discovery URL
        run: echo "Discovery - ${{ steps.start.outputs.url }}"
