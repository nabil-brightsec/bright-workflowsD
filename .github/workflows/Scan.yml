name: Bright Scan - project-level entrypoints (test)

on:
  workflow_dispatch:
    inputs:
      scan_name:
        description: "Scan name shown in the Bright dashboard"
        required: false
        default: "brokencrystals entrypoints scan"
      # --- Blocking options (uncomment together with the "Wait for issues" step) ---
      # severity:
      #   description: "Fail the job on first issue of this severity or higher"
      #   required: true
      #   default: "medium"
      #   type: choice
      #   options:
      #     - any
      #     - medium
      #     - high
      #     - critical
      # timeout_seconds:
      #   description: "How long to wait for issues before exiting"
      #   required: false
      #   default: "10800"
      project_id:
        description: "Bright project ID (blank = repo var BRIGHT_PROJECT_ID)"
        required: false
        default: ""
      repeater_id:
        description: "Repeater ID (blank = repo var BRIGHT_REPEATER_ID)"
        required: false
        default: ""
      entrypoint_statuses:
        description: "Comma-separated entrypoint statuses to include"
        required: false
        default: "new,changed,vulnerable"
      entrypoint_limit:
        description: "Max number of entrypoints to pull"
        required: false
        default: "2000"

permissions:
  contents: read
  security-events: write

jobs:
  bright:
    name: Entrypoints DAST scan
    runs-on: ubuntu-latest
    steps:
      - name: Resolve settings
        id: cfg
        run: |
          PID="${{ inputs.project_id || vars.BRIGHT_PROJECT_ID }}"
          RID="${{ inputs.repeater_id || vars.BRIGHT_REPEATER_ID }}"
          [ -z "$PID" ] && { echo "::error::No project ID"; exit 1; }
          [ -z "$RID" ] && { echo "::error::No repeater ID - internal targets need a repeater"; exit 1; }
          {
            echo "project=$PID"
            echo "repeaters=[\"$RID\"]"
            echo "name=${{ inputs.scan_name || 'brokencrystals entrypoints scan' }} ${{ github.sha }}"
            # echo "severity=${{ inputs.severity || 'medium' }}"
            # echo "timeout=${{ inputs.timeout_seconds || '10800' }}"
            echo "statuses=${{ inputs.entrypoint_statuses || 'new,changed,vulnerable' }}"
            echo "limit=${{ inputs.entrypoint_limit || '500' }}"
          } >> "$GITHUB_OUTPUT"
          echo "Project: $PID | Repeater: $RID"

      - name: List entrypoints
        id: entrypoints
        uses: BrightSec/list-entrypoints@v1.1
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          project_id: ${{ steps.cfg.outputs.project }}
          status: ${{ steps.cfg.outputs.statuses }}
          connectivity: ok
          limit: ${{ steps.cfg.outputs.limit }}
          ids_only: 'true'

      - name: Guard - fail if no entrypoints matched
        env:
          IDS: ${{ steps.entrypoints.outputs.entrypoints }}
        run: |
          COUNT=$(echo "${IDS:-[]}" | jq 'length')
          echo "Matched $COUNT entrypoints with status '${{ steps.cfg.outputs.statuses }}'"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No entrypoints matched - run the discovery workflow first, then re-run."
            exit 1
          fi

      - name: Start Bright scan (full test list)
        id: start
        uses: BrightSec/run-scan@v1.4
        with:
          api_token: ${{ secrets.BRIGHT_TOKEN }}
          name: ${{ steps.cfg.outputs.name }}
          project_id: ${{ steps.cfg.outputs.project }}
          repeaters: ${{ steps.cfg.outputs.repeaters }}
          entrypoints: ${{ steps.entrypoints.outputs.entrypoints }}
          module: dast
          tests: |
            ["amazon_s3_takeover","bopla","broken_saml_auth","brute_force_login","business_constraint_bypass","common_files","cookie_security","csrf","css_injection","cve_test","date_manipulation","default_login_location","directory_listing","email_injection","excessive_data_exposure","file_upload","full_path_disclosure","graphql_introspection","header_security","html_injection","http_method_fuzzing","id_enumeration","iframe_injection","improper_asset_management","insecure_output_handling","insecure_tls_configuration","jwt","ldapi","lfi","nosql","open_cloud_storage","open_database","osi","prompt_injection","proto_pollution","retire_js","rfi","secret_tokens","server_side_js_injection","sqli","ssrf","ssti","stored_xss","unvalidated_redirect","version_control_systems","wordpress","xpathi","xss","xxe"]

      - name: Show scan URL
        run: echo "Scan started - ${{ steps.start.outputs.url }}"

      # Blocking step disabled for testing - uncomment to fail the job on issues
      # - name: Wait for issues
      #   uses: BrightSec/wait-for@v1.1
      #   with:
      #     api_token: ${{ secrets.BRIGHT_TOKEN }}
      #     scan: ${{ steps.start.outputs.id }}
      #     wait_for: ${{ steps.cfg.outputs.severity }}
      #     timeout: ${{ steps.cfg.outputs.timeout }}
      #     stop_scan: true
      #     code_scanning_alerts: true
